<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for neurons -->
    <radialGradient id="neuron-gradient">
      <stop offset="0%" style="stop-color:#6b9bd1;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4a7ba7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a7b;stop-opacity:1" />
    </radialGradient>

    <!-- Gradient for output neurons -->
    <radialGradient id="output-gradient">
      <stop offset="0%" style="stop-color:#d1916b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#a76d4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b4a2d;stop-opacity:1" />
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Connection gradient -->
    <linearGradient id="connection-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a7ba7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4a7ba7;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg-gradient)"/>

  <!-- Stars in background -->
  <circle cx="120" cy="80" r="1" fill="white" opacity="0.6"/>
  <circle cx="980" cy="120" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="450" cy="50" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="750" cy="90" r="1" fill="white" opacity="0.7"/>
  <circle cx="200" cy="520" r="1" fill="white" opacity="0.6"/>
  <circle cx="900" cy="480" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="550" cy="550" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="1050" cy="380" r="1" fill="white" opacity="0.7"/>
  <circle cx="350" cy="300" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="850" cy="250" r="1.1" fill="white" opacity="0.7"/>
  <circle cx="300" cy="150" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="650" cy="80" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="150" cy="400" r="1" fill="white" opacity="0.7"/>
  <circle cx="1100" cy="200" r="0.8" fill="white" opacity="0.6"/>

  <!-- Connections - Input to Hidden 1 -->
  <g opacity="0.3" stroke="url(#connection-gradient)" stroke-width="1" fill="none">
    <line x1="168" y1="200" x2="384" y2="170"/>
    <line x1="168" y1="200" x2="384" y2="220"/>
    <line x1="168" y1="200" x2="384" y2="270"/>
    <line x1="168" y1="200" x2="384" y2="320"/>
    <line x1="168" y1="260" x2="384" y2="220"/>
    <line x1="168" y1="260" x2="384" y2="270"/>
    <line x1="168" y1="260" x2="384" y2="320"/>
    <line x1="168" y1="260" x2="384" y2="370"/>
    <line x1="168" y1="320" x2="384" y2="270"/>
    <line x1="168" y1="320" x2="384" y2="320"/>
    <line x1="168" y1="320" x2="384" y2="370"/>
    <line x1="168" y1="320" x2="384" y2="420"/>
    <line x1="168" y1="380" x2="384" y2="320"/>
    <line x1="168" y1="380" x2="384" y2="370"/>
    <line x1="168" y1="380" x2="384" y2="420"/>
    <line x1="168" y1="380" x2="384" y2="470"/>
    <line x1="168" y1="440" x2="384" y2="370"/>
    <line x1="168" y1="440" x2="384" y2="420"/>
    <line x1="168" y1="440" x2="384" y2="470"/>
    <line x1="168" y1="440" x2="384" y2="520"/>
  </g>

  <!-- Connections - Hidden 1 to Hidden 2 -->
  <g opacity="0.25" stroke="#6b9bd1" stroke-width="0.8" fill="none">
    <line x1="416" y1="170" x2="634" y2="170"/>
    <line x1="416" y1="170" x2="634" y2="220"/>
    <line x1="416" y1="220" x2="634" y2="170"/>
    <line x1="416" y1="220" x2="634" y2="220"/>
    <line x1="416" y1="220" x2="634" y2="270"/>
    <line x1="416" y1="270" x2="634" y2="220"/>
    <line x1="416" y1="270" x2="634" y2="270"/>
    <line x1="416" y1="270" x2="634" y2="320"/>
    <line x1="416" y1="320" x2="634" y2="270"/>
    <line x1="416" y1="320" x2="634" y2="320"/>
    <line x1="416" y1="320" x2="634" y2="370"/>
    <line x1="416" y1="370" x2="634" y2="320"/>
    <line x1="416" y1="370" x2="634" y2="370"/>
    <line x1="416" y1="370" x2="634" y2="420"/>
    <line x1="416" y1="420" x2="634" y2="370"/>
    <line x1="416" y1="420" x2="634" y2="420"/>
    <line x1="416" y1="420" x2="634" y2="470"/>
    <line x1="416" y1="470" x2="634" y2="420"/>
    <line x1="416" y1="470" x2="634" y2="470"/>
    <line x1="416" y1="470" x2="634" y2="520"/>
    <line x1="416" y1="520" x2="634" y2="470"/>
    <line x1="416" y1="520" x2="634" y2="520"/>
  </g>

  <!-- Connections - Hidden 2 to Hidden 3 -->
  <g opacity="0.3" stroke="#6b9bd1" stroke-width="1" fill="none">
    <line x1="666" y1="170" x2="884" y2="200"/>
    <line x1="666" y1="170" x2="884" y2="260"/>
    <line x1="666" y1="220" x2="884" y2="200"/>
    <line x1="666" y1="220" x2="884" y2="260"/>
    <line x1="666" y1="220" x2="884" y2="320"/>
    <line x1="666" y1="270" x2="884" y2="260"/>
    <line x1="666" y1="270" x2="884" y2="320"/>
    <line x1="666" y1="320" x2="884" y2="260"/>
    <line x1="666" y1="320" x2="884" y2="320"/>
    <line x1="666" y1="320" x2="884" y2="380"/>
    <line x1="666" y1="370" x2="884" y2="320"/>
    <line x1="666" y1="370" x2="884" y2="380"/>
    <line x1="666" y1="370" x2="884" y2="440"/>
    <line x1="666" y1="420" x2="884" y2="380"/>
    <line x1="666" y1="420" x2="884" y2="440"/>
    <line x1="666" y1="470" x2="884" y2="440"/>
    <line x1="666" y1="470" x2="884" y2="500"/>
    <line x1="666" y1="520" x2="884" y2="440"/>
    <line x1="666" y1="520" x2="884" y2="500"/>
  </g>

  <!-- Connections - Hidden 3 to Output -->
  <g opacity="0.4" stroke="#d9a88b" stroke-width="1.5" fill="none">
    <line x1="916" y1="200" x2="1032" y2="260"/>
    <line x1="916" y1="200" x2="1032" y2="320"/>
    <line x1="916" y1="260" x2="1032" y2="260"/>
    <line x1="916" y1="260" x2="1032" y2="320"/>
    <line x1="916" y1="260" x2="1032" y2="380"/>
    <line x1="916" y1="320" x2="1032" y2="260"/>
    <line x1="916" y1="320" x2="1032" y2="320"/>
    <line x1="916" y1="320" x2="1032" y2="380"/>
    <line x1="916" y1="380" x2="1032" y2="320"/>
    <line x1="916" y1="380" x2="1032" y2="380"/>
    <line x1="916" y1="440" x2="1032" y2="320"/>
    <line x1="916" y1="440" x2="1032" y2="380"/>
    <line x1="916" y1="500" x2="1032" y2="380"/>
  </g>

  <!-- Input Layer (5 neurons) -->
  <g id="input-layer">
    <circle cx="150" cy="200" r="20" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#8bb4d9" stroke-width="2.5"/>
    <circle cx="150" cy="260" r="20" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#8bb4d9" stroke-width="2.5"/>
    <circle cx="150" cy="320" r="20" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#8bb4d9" stroke-width="2.5"/>
    <circle cx="150" cy="380" r="20" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#8bb4d9" stroke-width="2.5"/>
    <circle cx="150" cy="440" r="20" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#8bb4d9" stroke-width="2.5"/>
  </g>

  <!-- Hidden Layer 1 (8 neurons) -->
  <g id="hidden-layer-1">
    <circle cx="400" cy="170" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="220" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="270" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="320" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="370" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="420" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="470" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="400" cy="520" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
  </g>

  <!-- Hidden Layer 2 (8 neurons) -->
  <g id="hidden-layer-2">
    <circle cx="650" cy="170" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="220" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="270" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="320" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="370" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="420" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="470" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="650" cy="520" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
  </g>

  <!-- Hidden Layer 3 (6 neurons) -->
  <g id="hidden-layer-3">
    <circle cx="900" cy="200" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="900" cy="260" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="900" cy="320" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="900" cy="380" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="900" cy="440" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
    <circle cx="900" cy="500" r="17" fill="url(#neuron-gradient)" filter="url(#glow)" stroke="#6b9bd1" stroke-width="2"/>
  </g>

  <!-- Output Layer (3 neurons) -->
  <g id="output-layer">
    <circle cx="1050" cy="260" r="20" fill="url(#output-gradient)" filter="url(#glow)" stroke="#d9a88b" stroke-width="2.5"/>
    <circle cx="1050" cy="320" r="20" fill="url(#output-gradient)" filter="url(#glow)" stroke="#d9a88b" stroke-width="2.5"/>
    <circle cx="1050" cy="380" r="20" fill="url(#output-gradient)" filter="url(#glow)" stroke="#d9a88b" stroke-width="2.5"/>
  </g>

  <!-- Flow arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8bb4d9" opacity="0.6"/>
    </marker>
  </defs>

  <line x1="240" y1="320" x2="310" y2="320" stroke="#8bb4d9" stroke-width="2.5" opacity="0.5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="320" x2="560" y2="320" stroke="#8bb4d9" stroke-width="2.5" opacity="0.5" marker-end="url(#arrowhead)"/>
  <line x1="740" y1="320" x2="810" y2="320" stroke="#8bb4d9" stroke-width="2.5" opacity="0.5" marker-end="url(#arrowhead)"/>
  <line x1="980" y1="320" x2="1015" y2="320" stroke="#d9a88b" stroke-width="2.5" opacity="0.5" marker-end="url(#arrowhead)"/>
</svg>
