<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Plot area -->
  <rect x="80" y="40" width="660" height="480" fill="white" stroke="#dee2e6" stroke-width="2"/>

  <!-- Grid lines -->
  <g stroke="#e9ecef" stroke-width="1">
    <line x1="80" y1="160" x2="740" y2="160"/>
    <line x1="80" y1="280" x2="740" y2="280"/>
    <line x1="80" y1="400" x2="740" y2="400"/>
    <line x1="245" y1="40" x2="245" y2="520"/>
    <line x1="410" y1="40" x2="410" y2="520"/>
    <line x1="575" y1="40" x2="575" y2="520"/>
  </g>

  <!-- Data points - scatter plot -->
  <g opacity="0.6">
    <!-- High mass galaxies (blue) -->
    <circle cx="150" cy="180" r="4" fill="#4a7ba7"/>
    <circle cx="180" cy="160" r="4" fill="#4a7ba7"/>
    <circle cx="210" cy="170" r="4" fill="#4a7ba7"/>
    <circle cx="240" cy="155" r="4" fill="#4a7ba7"/>
    <circle cx="270" cy="165" r="4" fill="#4a7ba7"/>
    <circle cx="300" cy="150" r="4" fill="#4a7ba7"/>
    <circle cx="330" cy="145" r="4" fill="#4a7ba7"/>
    <circle cx="360" cy="155" r="4" fill="#4a7ba7"/>
    <circle cx="390" cy="140" r="4" fill="#4a7ba7"/>
    <circle cx="420" cy="135" r="4" fill="#4a7ba7"/>
    <circle cx="450" cy="145" r="4" fill="#4a7ba7"/>
    <circle cx="480" cy="130" r="4" fill="#4a7ba7"/>
    <circle cx="510" cy="140" r="4" fill="#4a7ba7"/>
    <circle cx="540" cy="125" r="4" fill="#4a7ba7"/>
    <circle cx="570" cy="135" r="4" fill="#4a7ba7"/>
    <circle cx="600" cy="120" r="4" fill="#4a7ba7"/>
    <circle cx="630" cy="130" r="4" fill="#4a7ba7"/>
    <circle cx="660" cy="115" r="4" fill="#4a7ba7"/>
    <circle cx="690" cy="125" r="4" fill="#4a7ba7"/>
    <circle cx="720" cy="110" r="4" fill="#4a7ba7"/>

    <!-- Low mass galaxies (red) -->
    <circle cx="155" cy="220" r="4" fill="#d1916b"/>
    <circle cx="185" cy="210" r="4" fill="#d1916b"/>
    <circle cx="215" cy="225" r="4" fill="#d1916b"/>
    <circle cx="245" cy="215" r="4" fill="#d1916b"/>
    <circle cx="275" cy="230" r="4" fill="#d1916b"/>
    <circle cx="305" cy="220" r="4" fill="#d1916b"/>
    <circle cx="335" cy="235" r="4" fill="#d1916b"/>
    <circle cx="365" cy="225" r="4" fill="#d1916b"/>
    <circle cx="395" cy="240" r="4" fill="#d1916b"/>
    <circle cx="425" cy="230" r="4" fill="#d1916b"/>
    <circle cx="455" cy="245" r="4" fill="#d1916b"/>
    <circle cx="485" cy="235" r="4" fill="#d1916b"/>
    <circle cx="515" cy="250" r="4" fill="#d1916b"/>
    <circle cx="545" cy="240" r="4" fill="#d1916b"/>
    <circle cx="575" cy="255" r="4" fill="#d1916b"/>
    <circle cx="605" cy="245" r="4" fill="#d1916b"/>
    <circle cx="635" cy="260" r="4" fill="#d1916b"/>
    <circle cx="665" cy="250" r="4" fill="#d1916b"/>
    <circle cx="695" cy="265" r="4" fill="#d1916b"/>
    <circle cx="725" cy="255" r="4" fill="#d1916b"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="520" x2="740" y2="520" stroke="#212529" stroke-width="2"/>
  <line x1="80" y1="40" x2="80" y2="520" stroke="#212529" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="410" y="560" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle">Phase (days)</text>
  <text x="30" y="280" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" transform="rotate(-90 30 280)">Magnitude</text>

  <!-- Legend -->
  <circle cx="600" cy="70" r="5" fill="#4a7ba7"/>
  <text x="615" y="75" font-family="Arial, sans-serif" font-size="14" fill="#212529">High Mass</text>
  <circle cx="600" cy="95" r="5" fill="#d1916b"/>
  <text x="615" y="100" font-family="Arial, sans-serif" font-size="14" fill="#212529">Low Mass</text>

  <!-- Title -->
  <text x="410" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">Mass-Dependent Light Curve Evolution</text>
</svg>
