<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Star texture for cursor galaxy -->
    <filter id="cursor-stars">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="42"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="12" intercept="-6" />
      </feComponentTransfer>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7
                                           0 0 0 0 0.85
                                           0 0 0 0 1
                                           0 0 0 1 0" />
      <feGaussianBlur stdDeviation="0.3" />
    </filter>

    <!-- Core gradient -->
    <radialGradient id="cursor-core">
      <stop offset="0%" stop-color="#FFFFF8" />
      <stop offset="50%" stop-color="#FFE8A0" />
      <stop offset="100%" stop-color="#FFD080" stop-opacity="0" />
    </radialGradient>

    <!-- Arm mask -->
    <mask id="cursor-arms">
      <path d="M 16,16 C 20,10 28,11 30,16 C 32,21 26,26 20,25 C 14,24 10,20 12,14 C 13,11 15,10 16,16Z" fill="white" />
      <path d="M 16,16 C 12,22 4,21 2,16 C 0,11 6,6 12,7 C 18,8 22,12 20,18 C 19,21 17,22 16,16Z" fill="white" />
    </mask>
  </defs>

  <!-- Tilted galaxy -->
  <g transform="translate(16 16) rotate(-30) scale(1, 0.5) translate(-16 -16)">
    <!-- Star texture arms -->
    <rect x="0" y="0" width="32" height="32"
          fill="#FFF"
          filter="url(#cursor-stars)"
          mask="url(#cursor-arms)"
          opacity="0.9"/>

    <!-- Core -->
    <ellipse cx="16" cy="16" rx="5" ry="5" fill="url(#cursor-core)">
      <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="16" cy="16" rx="2.5" ry="2.5" fill="#FFFFFA"/>
  </g>

  <!-- A few sparkle stars -->
  <circle cx="8" cy="6" r="0.5" fill="white"/>
  <circle cx="25" cy="10" r="0.4" fill="white"/>
  <circle cx="22" cy="26" r="0.5" fill="#B0C8FF"/>
</svg>
